<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Petit Booth — Espace de gestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0416; --bg2:#120a20; --bg3:#1a0e30;
  --panel:rgba(28,16,48,0.55); --panel2:rgba(40,22,68,0.45);
  --panel-solid:#170d28; --border:rgba(199,125,255,0.16); --border2:rgba(199,125,255,0.32);
  --text:#f3ecff; --muted:#b6a6d4; --muted2:#8576a3;
  --pink:#FF4D8D; --magenta:#e63a8c; --coral:#ff7a5c; --violet:#C77DFF; --purple:#8a6bff;
  --gold:#EFDCA8;
  --grad:linear-gradient(135deg,#FF4D8D 0%,#C77DFF 55%,#8a6bff 100%);
  --grad-text:linear-gradient(90deg,#ff8fb1,#C77DFF 60%,#9d6bff);
  --grad-gold:linear-gradient(90deg,#EFDCA8,#e7a4cf,#C77DFF);
  --c-demande:#C77DFF; --c-devis:#f5c542; --c-attente:#4d9dff; --c-acompte:#2dd4bf; --c-confirme:#3ecf8e; --c-termine:#8d8aa6;
  --shadow:0 18px 50px -20px rgba(199,125,255,0.5);
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Manrope',-apple-system,sans-serif;
  color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
/* cosmic backdrop */
.cosmos{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(1200px 800px at 50% 12%, rgba(138,77,255,0.18), transparent 60%),
  radial-gradient(900px 700px at 85% 80%, rgba(230,58,140,0.14), transparent 55%),
  radial-gradient(700px 600px at 12% 70%, rgba(77,157,255,0.10), transparent 55%),
  linear-gradient(160deg,#08040f, #0d0718 55%, #08040f);}
.cosmos:after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.5),transparent),
  radial-gradient(1px 1px at 70% 60%,rgba(255,255,255,.35),transparent),
  radial-gradient(1px 1px at 40% 80%,rgba(255,255,255,.4),transparent),
  radial-gradient(1px 1px at 85% 25%,rgba(255,255,255,.3),transparent),
  radial-gradient(1.5px 1.5px at 55% 15%,rgba(255,255,255,.45),transparent);
  background-size:cover;opacity:.6}
.vortex{position:fixed;z-index:-1;width:1100px;height:1100px;left:50%;top:42%;transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none;opacity:.5;
  background:conic-gradient(from 0deg, transparent, rgba(177,92,255,.10), transparent, rgba(230,58,140,.08), transparent);
  -webkit-mask:radial-gradient(circle, transparent 26%, #000 30%, #000 60%, transparent 66%);
  mask:radial-gradient(circle, transparent 26%, #000 30%, #000 60%, transparent 66%);
  animation:spin 80s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.gtext{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.gold{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- BUTTONS ---------- */
.btn{font-family:inherit;font-weight:600;border:none;cursor:pointer;border-radius:12px;padding:11px 18px;font-size:14px;
  color:#fff;background:var(--grad);transition:.18s;letter-spacing:.2px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px -8px rgba(199,125,255,.7)}
.btn.neon{background:transparent;border:1.5px solid transparent;color:#fff;position:relative;
  background:linear-gradient(var(--bg2),var(--bg2)) padding-box,var(--grad) border-box;
  box-shadow:0 0 18px -4px rgba(199,125,255,.55), inset 0 0 14px -8px rgba(255,126,179,.6)}
.btn.neon:hover{box-shadow:0 0 28px -2px rgba(199,125,255,.85)}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--muted)}
.btn.ghost:hover{color:#fff;box-shadow:none;background:var(--panel2)}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn.danger{background:linear-gradient(135deg,#ff6b6b,#c2185b)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

input,select,textarea{font-family:inherit;width:100%;background:rgba(12,7,22,.6);border:1px solid var(--border);
  color:var(--text);border-radius:11px;padding:11px 13px;font-size:14px;transition:.15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(177,92,255,.15)}
label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin:0 0 6px 2px}
.field{margin-bottom:14px}
select option{background:#170d28}
::placeholder{color:var(--muted2)}

.card{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:420px;padding:38px 34px;text-align:center;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px}
.brand-name{font-family:'Sora';font-weight:800;font-size:21px;letter-spacing:1px}
.brand-name .b{color:var(--coral)}
.brand-name .p{color:var(--violet)}
.brand-tag{font-size:9.5px;letter-spacing:4px;color:var(--muted2);font-weight:600}
.login-tabs{display:flex;gap:8px;margin:26px 0 22px;background:rgba(12,7,22,.5);padding:5px;border-radius:13px}
.login-tabs button{flex:1;background:transparent;border:none;color:var(--muted);font-family:inherit;font-weight:600;
  padding:10px;border-radius:9px;cursor:pointer;font-size:13.5px;transition:.18s}
.login-tabs button.active{background:var(--grad);color:#fff;box-shadow:0 6px 18px -6px rgba(199,125,255,.6)}
.hint{font-size:11.5px;color:var(--muted2);margin-top:14px;line-height:1.5}
.hint code{color:var(--violet);background:rgba(177,92,255,.12);padding:1px 6px;border-radius:5px}
.err{color:#ff8585;font-size:12.5px;margin-top:6px;min-height:16px;text-align:left}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:246px;flex-shrink:0;padding:22px 16px;border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:rgba(10,5,18,.55);backdrop-filter:blur(12px)}
.side-logo{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
.side-logo .brand-name{font-size:15px;letter-spacing:.5px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:var(--muted);
  text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;transition:.15s;position:relative}
.nav a svg{width:19px;height:19px;flex-shrink:0;opacity:.85}
.nav a:hover{background:var(--panel2);color:#fff}
.nav a.active{color:#fff;background:linear-gradient(90deg,rgba(177,92,255,.22),rgba(230,58,140,.10))}
.nav a.active:before{content:"";position:absolute;left:0;top:18%;height:64%;width:3px;border-radius:3px;background:var(--grad)}
.side-foot{border-top:1px solid var(--border);padding-top:14px;font-size:12px;color:var(--muted2)}
.side-foot .who{color:var(--text);font-weight:600;font-size:13px;margin-bottom:2px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;gap:16px;
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background:rgba(8,4,15,.6);border-bottom:1px solid var(--border)}
.topbar h1{font-family:'Sora';font-size:20px;font-weight:700;letter-spacing:.3px}
.topbar .sub{font-size:12.5px;color:var(--muted2);margin-top:1px}
.content{padding:26px 30px 60px;max-width:1400px;width:100%}
.burger{display:none;background:transparent;border:1px solid var(--border2);border-radius:10px;color:#fff;padding:8px 10px;cursor:pointer}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px}
.stat{padding:20px;position:relative;overflow:hidden}
.stat .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(255,126,179,.18),rgba(138,107,255,.18));border:1px solid var(--border)}
.stat .ic svg{width:20px;height:20px;color:var(--violet)}
.stat .val{font-family:'Sora';font-size:30px;font-weight:800;line-height:1}
.stat .lbl{font-size:12.5px;color:var(--muted);margin-top:7px;font-weight:500}
.stat .val.small{font-size:18px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.sec-title{font-family:'Sora';font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.sec-title .pill{font-size:11px;font-weight:600;background:var(--panel2);border:1px solid var(--border);padding:2px 9px;border-radius:20px;color:var(--muted)}

.evrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
.evrow:last-child{border-bottom:none}
.evrow .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 10px currentColor}
.evrow .nm{font-weight:600;font-size:14px}
.evrow .me{font-size:12px;color:var(--muted2);margin-top:2px}
.evrow .rt{margin-left:auto;text-align:right}
.evrow .rt .d{font-weight:700;font-size:13.5px}
.evrow .rt .h{font-size:11.5px;color:var(--muted2)}
.empty{text-align:center;color:var(--muted2);padding:34px 10px;font-size:13.5px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;
  border:1px solid;white-space:nowrap}
.badge .d{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ---------- PIPELINE ---------- */
.pipe-wrap{overflow-x:auto;padding-bottom:14px}
.pipe{display:flex;gap:14px;min-width:max-content}
.col{width:268px;flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:16px;
  display:flex;flex-direction:column;max-height:calc(100vh - 200px)}
.col.drop{outline:2px dashed var(--violet);outline-offset:-3px;background:rgba(177,92,255,.08)}
.col-head{padding:14px 15px 10px;display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;
  border-bottom:1px solid var(--border)}
.col-head .cnt{margin-left:auto;font-size:12px;color:var(--muted2);background:rgba(12,7,22,.5);
  padding:1px 9px;border-radius:20px;font-weight:600}
.col-body{padding:11px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:60px}
.kard{background:linear-gradient(160deg,rgba(40,22,68,.7),rgba(24,13,42,.7));border:1px solid var(--border);
  border-radius:13px;padding:13px;cursor:grab;transition:.15s;border-left:3px solid var(--violet)}
.kard:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(199,125,255,.6)}
.kard.dragging{opacity:.4}
.kard .knm{font-weight:700;font-size:14px}
.kard .ktype{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.kard .kfoot{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.kard .kdate{font-size:11.5px;color:var(--muted2)}
.kard .kamt{font-weight:800;font-size:13px;font-family:'Sora'}
.kard .kmeta{font-size:11px;color:var(--violet);margin-top:5px}

/* ---------- TABLE / LIST ---------- */
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.toolbar .search{position:relative;flex:1;min-width:200px;max-width:340px}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted2)}
.toolbar .search input{padding-left:37px}
.seg{display:flex;background:rgba(12,7,22,.5);border:1px solid var(--border);border-radius:11px;padding:4px;gap:3px}
.seg button{background:transparent;border:none;color:var(--muted);font-family:inherit;font-weight:600;font-size:13px;
  padding:7px 14px;border-radius:8px;cursor:pointer;transition:.15s}
.seg button.active{background:var(--grad);color:#fff}

/* ---------- CALENDAR ---------- */
.cal-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:6px}
.icon-btn{background:var(--panel2);border:1px solid var(--border);color:#fff;width:36px;height:36px;border-radius:10px;
  cursor:pointer;display:grid;place-items:center;transition:.15s}
.icon-btn:hover{border-color:var(--border2);background:var(--bg3)}
.cal-title{font-family:'Sora';font-weight:700;font-size:17px;min-width:200px;text-transform:capitalize}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
.legend span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);
  border-radius:14px;overflow:hidden}
.cal-dow{background:var(--panel-solid);padding:9px;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.cal-cell{background:rgba(16,9,28,.7);min-height:104px;padding:7px;display:flex;flex-direction:column;gap:4px}
.cal-cell.out{background:rgba(10,5,18,.6);opacity:.5}
.cal-cell .dn{font-size:12px;color:var(--muted);font-weight:600;align-self:flex-start}
.cal-cell.today .dn{background:var(--grad);color:#fff;width:23px;height:23px;border-radius:50%;display:grid;place-items:center}
.cal-ev{font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;cursor:pointer;color:#08040f;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.12s}
.cal-ev:hover{transform:scale(1.02);filter:brightness(1.08)}

.week-grid{display:grid;grid-template-columns:60px repeat(7,1fr);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.week-grid .wh{background:var(--panel-solid);padding:9px 6px;text-align:center;font-size:12px;font-weight:700;border-bottom:1px solid var(--border)}
.week-grid .wh small{display:block;color:var(--muted2);font-weight:500;font-size:10.5px}
.week-grid .tcell{border-bottom:1px solid var(--border);border-right:1px solid var(--border);min-height:48px;padding:2px;position:relative}
.week-grid .tlabel{font-size:11px;color:var(--muted2);text-align:right;padding:4px 7px;border-bottom:1px solid var(--border)}
.week-ev{font-size:10.5px;font-weight:600;padding:3px 6px;border-radius:6px;color:#08040f;margin-bottom:2px;cursor:pointer;overflow:hidden}

.year-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ymonth{padding:14px}
.ymonth h4{font-family:'Sora';font-size:13.5px;margin-bottom:10px;text-transform:capitalize}
.ymini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ymini span{font-size:9.5px;text-align:center;padding:3px 0;border-radius:4px;color:var(--muted2);position:relative}
.ymini span.has{color:#08040f;font-weight:700}
.ymini span.today-y{outline:1px solid var(--violet)}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,2,9,.72);backdrop-filter:blur(6px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:36px 18px;overflow-y:auto;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:760px;background:linear-gradient(160deg,#1b1030,#130a22);border:1px solid var(--border2);
  border-radius:20px;box-shadow:0 40px 90px -30px #000;animation:rise .35s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
.modal-head{padding:22px 26px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px;
  background:linear-gradient(120deg,rgba(177,92,255,.12),transparent)}
.modal-head .ti{flex:1}
.modal-head h2{font-family:'Sora';font-size:20px;font-weight:700}
.modal-head .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.modal-close{background:var(--panel2);border:1px solid var(--border);color:#fff;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:18px;line-height:1}
.modal-body{padding:24px 26px;max-height:64vh;overflow-y:auto}
.modal-foot{padding:16px 26px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .full{grid-column:1/-1}
.block-title{font-family:'Sora';font-size:13px;font-weight:700;color:var(--violet);text-transform:uppercase;letter-spacing:.6px;
  margin:18px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.block-title:first-child{margin-top:0}
.docrow{display:flex;align-items:center;gap:12px;padding:11px 13px;background:rgba(12,7,22,.45);border:1px solid var(--border);
  border-radius:11px;margin-bottom:9px}
.docrow .di{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(177,92,255,.14);color:var(--violet)}
.docrow .dn{font-weight:600;font-size:13px}
.docrow .ds{font-size:11px;color:var(--muted2)}
.docrow .da{margin-left:auto;display:flex;gap:8px}
.linklike{color:var(--violet);font-size:12.5px;font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit}
.linklike:hover{text-decoration:underline}

/* prestataires */
.prest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.prest{padding:20px}
.prest .ph{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.avatar{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-family:'Sora';font-weight:800;font-size:18px;
  color:#fff;background:var(--grad);box-shadow:0 8px 20px -8px rgba(199,125,255,.7)}
.prest .pn{font-family:'Sora';font-weight:700;font-size:16px}
.prest .pr{font-size:12px;color:var(--muted2)}
.prest .pstats{display:flex;gap:10px;margin-bottom:14px}
.prest .pstat{flex:1;text-align:center;background:rgba(12,7,22,.4);border:1px solid var(--border);border-radius:11px;padding:11px 6px}
.prest .pstat b{font-family:'Sora';font-size:19px;display:block}
.prest .pstat span{font-size:10.5px;color:var(--muted2)}
.mini-ev{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.mini-ev:last-child{border:none}
.mini-ev .md{color:var(--muted2);font-size:11px;margin-left:auto;text-align:right}

/* emails */
.mailcard{padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;gap:16px}
.mailcard .when{width:140px;flex-shrink:0}
.mailcard .when b{font-family:'Sora';font-size:14px;display:block}
.mailcard .when span{font-size:11px;color:var(--muted2)}
.tmpl{padding:18px;margin-bottom:14px}
.tmpl h4{font-family:'Sora';font-size:14px;margin-bottom:4px}
.tmpl .tg{font-size:11.5px;color:var(--muted2);margin-bottom:12px}
.tmpl textarea{min-height:78px;resize:vertical}

/* client portal */
.portal{max-width:760px;margin:0 auto}
.hero-card{padding:34px;text-align:center;margin-bottom:22px;position:relative;overflow:hidden}
.hero-card .eyebrow{font-size:12px;letter-spacing:3px;color:var(--muted2);font-weight:600;text-transform:uppercase}
.hero-card h2{font-family:'Sora';font-size:30px;font-weight:800;margin:8px 0 4px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.info-tile{padding:18px}
.info-tile .il{font-size:11.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.info-tile .il svg{width:15px;height:15px;color:var(--violet)}
.info-tile .iv{font-family:'Sora';font-size:18px;font-weight:700;margin-top:8px}

/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120px);z-index:200;
  background:linear-gradient(135deg,#241338,#1a0e2c);border:1px solid var(--border2);color:#fff;padding:13px 20px;border-radius:13px;

   LOGIN

const ADMIN_ID='KevinObscur';
async function doAdminLogin(){
  const u=($('#admin-user').value||'').trim();
  const p=($('#admin-pass').value||'').trim();
  const errEl=$('#admin-err');
  if(!supa){ errEl.textContent=supaProblemMsg(); return; }
  if(u!==ADMIN_ID){ errEl.textContent='Identifiant ou mot de passe incorrect.'; return; }
  errEl.textContent='Connexion…';
  try{
    const {data,error}=await supa.rpc('admin_data',{p_pw:p});
    if(error){
      const kind=classifyErr(error);
      errEl.textContent = kind==='pw' ? 'Identifiant ou mot de passe incorrect.'
        : kind==='nosql' ? "Base connectée, mais le script SQL n'est pas exécuté. Lancez supabase-setup.sql dans Supabase."
        : kind==='key' ? "Clé Supabase refusée. Vérifiez la clé « anon/publishable » et l'URL du projet."
        : "Erreur : "+(error.message||'inconnue');
      return;
    }
    state.adminPw=p;
    state.clients=(data&&data.clients)||[];
    state.prestataires=(data&&data.prestataires)||[];
    state.clients.forEach(c=>{ if(!Array.isArray(c.options))c.options=[]; if(!c.documents)c.documents={}; });
    state.user={role:'admin',name:'Kevin Obscur'}; errEl.textContent=''; enterApp();
  }catch(e){ errEl.textContent="Base injoignable (URL ou connexion internet)."; console.error(e); }
}

/* ---------- Notification des paiements Stripe ---------- */
async function chargerPaiements(){
  if(!supa) return;
  try{
    const { data, error } = await supa.from('paiements_recents').select('*').limit(12);
    if(!error && data){
      state.paiements = data;
      majBadgePaiements();
    }
  }catch(e){ /* silencieux */ }
}

function majBadgePaiements(){
  const nb = (state.paiements||[]).filter(p=>!p.vu).length;
  const el = document.getElementById('badge-paiements');
  if(el){ el.textContent = nb; el.style.display = nb ? 'inline-flex' : 'none'; }
  if(nb && state.route==='dashboard') render();
}

async function marquerPaiementsVus(){
  try{
    if(supa) await supa.rpc('paiements_marquer_vus');
    (state.paiements||[]).forEach(p=>p.vu=true);
    majBadgePaiements(); render();
  }catch(e){ console.error(e); }
}

  const list = state.paiements || [];

  const lib = { acompte:'Acompte', solde:'Solde', total:'Règlement intégral' };
  return `<div class="card" style="padding:22px;margin-bottom:18px${nonVus?';border-color:rgba(62,207,142,.5)':''}">
    <div class="sec-title" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <span>${nonVus?`🔔 ${nonVus} nouveau${nonVus>1?'x':''} paiement${nonVus>1?'s':''}`:'Paiements récents'}</span>
      ${nonVus?`<button class="btn ghost sm" onclick="App.marquerPaiementsVus()">Marquer comme lus</button>`:''}
    </div>

      ${list.slice(0,8).map(p=>`
        <div class="frow" style="${p.vu?'':'background:rgba(62,207,142,.07);border-radius:9px;padding:8px 10px'}">

            ${p.moyen==='stripe'?' · carte':''}

function viewDashboard(){
  const cl=state.clients;
  const devis=cl.filter(c=>['devis','attente'].includes(c.status)).length;

    ${stat(I.check,conf,'Prestations confirmées')}
    ${stat(I.flag,term,'Prestations terminées')}
    ${stat(I.euro,eur(caMois),'CA prévisionnel du mois',true)}

        <div class="evrow" onclick="App.openClient('${c.id}')" style="cursor:pointer">
          <span class="dot" style="color:${s.ccol}"></span>
          <div><div class="nm">${esc(c.prenom)} ${esc(c.nom)}</div>
          <div class="me">${esc(c.typeEvenement)} · ${esc(c.lieu||'Lieu à définir')} · ${esc(c.prestataire||'Non assigné')}</div></div>
          <div class="rt"><div class="d">${fmtShort(parseD(c.datePrestation))}</div>
          <div class="h">${esc(c.heureDebut||'')}${c.heureFin?' – '+esc(c.heureFin):''}</div></div>
        </div>`}).join(''):`<div class="empty">Aucun événement à venir.</div>`}
    </div>
    <div class="card" style="padding:22px">
      <div class="sec-title">Répartition du pipeline</div>
      ${STAGES.map(s=>{const n=cl.filter(c=>c.status===s.id).length;const pct=cl.length?Math.round(n/cl.length*100):0;

function pipeSearch(v){state.pipeSearch=v;}
let dragId=null;
function bindPipe(){
  document.querySelectorAll('.kard').forEach(k=>{
    k.addEventListener('dragstart',e=>{dragId=k.dataset.id;k.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    k.addEventListener('dragend',()=>{dragId=null;k.classList.remove('dragging');});
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drop');});
    col.addEventListener('dragleave',()=>col.classList.remove('drop'));
    col.addEventListener('drop',async e=>{e.preventDefault();col.classList.remove('drop');
      if(!dragId)return; const c=findClient(dragId); const st=col.dataset.stage;
      if(c&&c.status!==st){c.status=st;render();bindPipe?.();toast(`${c.prenom} → ${stageOf(st).label}`);
        try{await dbSaveClient(c);}catch(err){toast('Erreur d\'enregistrement');console.error(err);} }
    });
  });
}

function openClient(id){
  state.modalClientId=id||null;
  const src=id?findClient(id):null;
  state.editOptions=src&&Array.isArray(src.options)?src.options.map(o=>({id:o.id||uid(),nom:o.nom,prix:o.prix})):[];
  // affectations prestataires (migration depuis l'ancien champ "prestataire")
  let asg=src&&Array.isArray(src.assignments)?src.assignments.map(a=>({id:a.id||uid(),nom:a.nom||'',heureDebut:a.heureDebut||'',heureFin:a.heureFin||'',montant:a.montant??''})):[];
  if(!asg.length && src && src.prestataire){ asg=[{id:uid(),nom:src.prestataire,heureDebut:'',heureFin:'',montant:src.prestataireMontant??''}]; }
  state.editAssign=asg;
  state.prestMode=(src&&src.prestMode)|| (asg.length>1?'multi':'single');
  renderModal();
}

function onFormule(v){
  const m=$('#cf-montant'); const w=$('#cf-perso-wrap');
  if(w) w.style.display = (v==='perso') ? '' : 'none';
  // Prestation personnalisée : on laisse le prix libre (pas d'écrasement)
  if(m && FORMULES[v] && v!=='perso') m.value=FORMULES[v].prix;
  recalcTotal();
}
/* ---- total + acompte en direct ---- */
function recalcTotal(){
  const base=Number(($('#cf-montant')?.value)||0);
  const opt=state.editOptions.reduce((s,o)=>s+Number(o.prix||0),0);
  const km=Number(($('#cf-fraisKm')?.value)||0);
  const rem=Number(($('#cf-remise')?.value)||0);
  const total=Math.max(0,base+opt+km-rem);
  const pct=Math.max(0,Math.min(100,Number(($('#cf-acomptePct')?.value)||0)));
  const ac=Math.round(total*pct/100*100)/100;
  const el=$('#opt-total'); if(!el)return;
  el.innerHTML=`Formule : <b style="color:var(--text)">${eur(base)}</b> &nbsp;·&nbsp; Options : <b style="color:var(--text)">${eur(opt)}</b>`
    + (km?` &nbsp;·&nbsp; Déplacement : <b style="color:var(--text)">${eur(km)}</b>`:'')
    + (rem?` &nbsp;·&nbsp; Remise : <b style="color:var(--pink)">– ${eur(rem)}</b>`:'')
    + ` &nbsp;·&nbsp; <span class="gtext" style="font-family:'Sora';font-weight:800;font-size:15px">Total : ${eur(total)}</span>`
    + (pct>0?`<div style="margin-top:8px;color:var(--muted)">Acompte ${pct}% : <b style="color:var(--c-acompte)">${eur(ac)}</b> &nbsp;·&nbsp; Solde : <b style="color:var(--text)">${eur(total-ac)}</b></div>`:'');
}

function getForm(){

async function saveClient(id){
  const data=getForm();
  if(!data.prenom&&!data.nom){toast('Indiquez au moins un nom.');return;}
  // options nettoyées
  data.options=state.editOptions
    .filter(o=>(o.nom&&o.nom.trim())||Number(o.prix)>0)
    .map(o=>({id:o.id||uid(),nom:(o.nom||'').trim(),prix:Number(o.prix||0)}));
  // affectations prestataires nettoyées (on garde celles avec un prestataire choisi)
  let asg=(state.prestMode==='single'?state.editAssign.slice(0,1):state.editAssign)
    .filter(a=>a.nom&&a.nom.trim())
    .map(a=>({id:a.id||uid(),nom:a.nom.trim(),heureDebut:a.heureDebut||'',heureFin:a.heureFin||'',montant:Number(a.montant||0)}));
  data.assignments=asg;
  data.prestMode=state.prestMode;
  data.prestataire=asg.map(a=>a.nom).join(', ');   // champ d'affichage (compat calendrier/planning)
  let c;
  if(id){ c=findClient(id); Object.assign(c,data); }
  else { c=Object.assign({id:uid(),token:genToken(),documents:{},createdAt:Date.now()},data); state.clients.push(c); }
  closeModal(); render(); if(state.route==='pipeline')bindPipe();
  try{ await dbSaveClient(c); toast('Fiche enregistrée ✓'); }catch(err){ toast('Erreur d\'enregistrement (base)'); console.error(err); }
}
async function deleteClient(id){
  if(!confirm('Supprimer définitivement cette fiche client ?'))return;
  state.clients=state.clients.filter(c=>c.id!==id); closeModal(); render(); if(state.route==='pipeline')bindPipe();
  try{ await dbDeleteClient(id); toast('Fiche supprimée'); }catch(err){ toast('Erreur (base)'); console.error(err); }
}
function uploadDoc(key,input){
  const file=input.files[0]; if(!file)return;
  const r=new FileReader();

    if(!c){toast('Enregistrez d\'abord la fiche.');return;}

/* =========================================================
   PLANNING (calendrier)
========================================================= */
function eventsOn(d){ return state.clients.filter(c=>c.datePrestation&&sameDay(parseD(c.datePrestation),d)); }
function viewPlanning(){
  const v=state.calView;
  const seg=`<div class="seg">${['day','week','month','year'].map(x=>
    `<button class="${v===x?'active':''}" onclick="App.setCalView('${x}')">${({day:'Jour',week:'Semaine',month:'Mois',year:'Année'})[x]}</button>`).join('')}</div>`;
  const legend=`<div class="legend">
    <span><i style="background:var(--c-devis)"></i>Devis</span>
    <span><i style="background:var(--c-attente)"></i>En attente</span>
    <span><i style="background:var(--c-confirme)"></i>Confirmé</span>
    <span><i style="background:var(--c-termine)"></i>Terminé</span></div>`;
  return `<div class="cal-top">
    <div class="cal-nav">
      <button class="icon-btn" onclick="App.calNav(-1)">‹</button>
      <button class="icon-btn" onclick="App.calToday()">${ic(I.cal,16)}</button>
      <button class="icon-btn" onclick="App.calNav(1)">›</button>
    </div>
    <div class="cal-title">${calTitle()}</div>
    ${seg}${legend}
  </div>
  <div class="card" style="padding:16px">${
    v==='month'?calMonth():v==='week'?calWeek():v==='day'?calDay():calYear()
  }</div>`;
}
function setCalView(v){state.calView=v;render();}
function calToday(){state.calDate=today();render();}
function calNav(dir){const d=new Date(state.calDate);
  if(state.calView==='month')d.setMonth(d.getMonth()+dir);
  else if(state.calView==='week')d.setDate(d.getDate()+7*dir);
  else if(state.calView==='day')d.setDate(d.getDate()+dir);
  else d.setFullYear(d.getFullYear()+dir);
  state.calDate=d;render();}
function calTitle(){const d=state.calDate;
  if(state.calView==='year')return d.getFullYear();
  if(state.calView==='day')return fmtD(d);
  if(state.calView==='week'){const s=startOfWeek(d);const e=new Date(s);e.setDate(s.getDate()+6);
    return `${s.getDate()} – ${e.getDate()} ${MONTHS[e.getMonth()]} ${e.getFullYear()}`;}
  return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;}
function startOfWeek(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function evChip(c,cls){const s=stageOf(c.status);
  return `<div class="${cls}" style="background:${s.ccol}" title="${esc(c.prenom+' '+c.nom)}" onclick="event.stopPropagation();App.openClient('${c.id}')">${esc(c.heureDebut?c.heureDebut+' ':'')}${esc(c.prenom)} ${esc(c.nom)}</div>`;}

function calMonth(){
  const d=state.calDate; const first=new Date(d.getFullYear(),d.getMonth(),1);
  const start=startOfWeek(first); const cells=[];
  for(let i=0;i<42;i++){const cur=new Date(start);cur.setDate(start.getDate()+i);cells.push(cur);}
  return `<div class="cal-grid">
    ${DOW.map(x=>`<div class="cal-dow">${x}</div>`).join('')}
    ${cells.map(cur=>{const out=cur.getMonth()!==d.getMonth();const evs=eventsOn(cur);const isT=sameDay(cur,today());
      return `<div class="cal-cell ${out?'out':''} ${isT?'today':''}">
        <span class="dn">${cur.getDate()}</span>
        ${evs.slice(0,3).map(c=>evChip(c,'cal-ev')).join('')}
        ${evs.length>3?`<span class="cnt-mini" style="font-size:10px;color:var(--muted2)">+${evs.length-3}</span>`:''}
        ${evs.length?`<span class="cnt-mini" style="display:none">${evs.length}</span>`:''}
      </div>`;}).join('')}
  </div>`;
}
function calWeek(){
  const s=startOfWeek(state.calDate);
  const days=[...Array(7)].map((_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);return x;});
  const hours=[...Array(15)].map((_,i)=>i+8); // 8h → 22h
  return `<div class="week-grid">
    <div class="wh"></div>
    ${days.map(x=>`<div class="wh">${DOW[(x.getDay()+6)%7]}<small>${x.getDate()}/${x.getMonth()+1}</small></div>`).join('')}
    ${hours.map(h=>`<div class="tlabel">${String(h).padStart(2,'0')}h</div>
      ${days.map(x=>{const evs=eventsOn(x).filter(c=>{const sh=parseInt((c.heureDebut||'0').split(':')[0]);return sh===h;});
        return `<div class="tcell">${evs.map(c=>evChip(c,'week-ev')).join('')}</div>`;}).join('')}`).join('')}
  </div>`;
}
function calDay(){
  const d=state.calDate; const evs=eventsOn(d).sort((a,b)=>(a.heureDebut||'').localeCompare(b.heureDebut||''));
  if(!evs.length)return `<div class="empty">Aucune prestation le ${fmtD(d)}.</div>`;
  return evs.map(c=>{const s=stageOf(c.status);return `
    <div class="evrow" style="cursor:pointer;padding:16px 8px" onclick="App.openClient('${c.id}')">
      <span class="dot" style="color:${s.ccol}"></span>
      <div><div class="nm">${esc(c.prenom)} ${esc(c.nom)} — ${esc(c.typeEvenement)}</div>
        <div class="me">${esc(c.lieu||'Lieu à définir')} · ${esc(c.prestataire||'Non assigné')}</div></div>
      <div class="rt"><div class="d">${esc(c.heureDebut||'—')}${c.heureFin?' – '+esc(c.heureFin):''}</div>
        <div class="h">${esc(formuleLabel(c))}</div></div>
    </div>`;}).join('');
}
function calYear(){
  const y=state.calDate.getFullYear();
  return `<div class="year-grid">
    ${MONTHS.map((mn,mi)=>{const first=new Date(y,mi,1);const start=startOfWeek(first);
      const cells=[...Array(42)].map((_,i)=>{const x=new Date(start);x.setDate(start.getDate()+i);return x;});
      return `<div class="ymonth card" style="background:rgba(12,7,22,.4);cursor:pointer" onclick="App.openMonth(${mi})">
        <h4>${mn}</h4>
        <div class="ymini">${DOW.map(x=>`<span style="color:var(--muted2);font-size:8px">${x[0]}</span>`).join('')}
        ${cells.map(cur=>{const out=cur.getMonth()!==mi;const has=eventsOn(cur).length;const s=has?stageOf(eventsOn(cur)[0].status):null;
          return `<span class="${has?'has':''} ${sameDay(cur,today())?'today-y':''}" style="${out?'opacity:.25;':''}${has?'background:'+s.ccol:''}">${cur.getDate()}</span>`;}).join('')}
        </div></div>`;}).join('')}
  </div>`;
}
function openMonth(mi){state.calDate=new Date(state.calDate.getFullYear(),mi,1);state.calView='month';render();}

async function savePrest(id){
  const nom=($('#pf-nom').value||'').trim(); const role=($('#pf-role').value||'').trim();
  if(!nom){toast('Indiquez un nom.');return;}
  let p, affected=[];
  if(id){ p=state.prestataires.find(x=>x.id===id); const old=p.nom; p.nom=nom; p.role=role;
    if(old!==nom){ affected=state.clients.filter(c=>clientHasPrest(c,old));
      affected.forEach(c=>{ assignmentsOf(c).forEach(a=>{ if(a.nom===old)a.nom=nom; }); c.prestataire=prestNamesDisplay(c); }); }
  } else { p={id:uid(),token:genToken(),nom,role}; state.prestataires.push(p); }
  closePrest(); render();
  try{ await dbSavePrest(p); for(const c of affected) await dbSaveClient(c); toast('Prestataire enregistré ✓'); }
  catch(err){ toast('Erreur (base)'); console.error(err); }
}
async function deletePrest(id){
  const p=state.prestataires.find(x=>x.id===id); if(!p)return;
  const affected=state.clients.filter(c=>clientHasPrest(c,p.nom));
  if(!confirm(`Supprimer ${p.nom} ?`+(affected.length?`\n${affected.length} client(s) : ce prestataire sera retiré de leur affectation.`:'')))return;
  state.prestataires=state.prestataires.filter(x=>x.id!==id);
  affected.forEach(c=>{ c.assignments=assignmentsOf(c).filter(a=>a.nom!==p.nom); c.prestataire=prestNamesDisplay(c); });
  closePrest(); render();
  try{ await dbDeletePrest(id); for(const c of affected) await dbSaveClient(c); toast('Prestataire supprimé'); }
  catch(err){ toast('Erreur (base)'); console.error(err); }
}

function factMerge(base, over){
  const out = JSON.parse(JSON.stringify(base));
  Object.keys(over || {}).forEach(k => {
    if (over[k] && typeof over[k] === 'object' && !Array.isArray(over[k])) out[k] = factMerge(out[k] || {}, over[k]);
    else if (over[k] !== undefined && over[k] !== null) out[k] = over[k];
  });
  return out;
}

/* ---------- Charte graphique des PDF ----------
   Les couleurs sont lues en direct dans les variables CSS du site
   (--violet, --pink, --purple, --bg3…) : si la charte du site change,
   les documents suivent automatiquement. L'administration peut aussi
   imposer des couleurs personnalisées (FACT.design).                 */
function hex2rgb(h){
  if (Array.isArray(h)) return h;
  const m = String(h || '').trim().match(/^#?([0-9a-f]{6})$/i);
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgb2hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
const lerpC = (a, b, t) => [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * t));
function siteVar(n){
  try { return (getComputedStyle(document.documentElement).getPropertyValue(n) || '').trim(); }
  catch (_){ return ''; }
}
function pdfTheme(){
  const D = FACT.design || {};
  const c = (v, sv, fb) => hex2rgb(v) || hex2rgb(siteVar(sv)) || hex2rgb(fb);
  const principale = c(D.couleurPrincipale, '--violet', '#C77DFF');
  return {
    principale,
    secondaire: c(D.couleurSecondaire, '--pink', '#FF4D8D'),
    g1: c(D.degrade1, '--pink',   '#FF4D8D'),
    g2: c(D.degrade2, '--violet', '#C77DFF'),
    g3: c(D.degrade3, '--purple', '#8a6bff'),
    sombre: c(D.couleurTitres, '--bg3', '#1a0e30'),
    carte: hex2rgb(D.couleurCartes) || lerpC(principale, [255, 255, 255], 0.94),
    bord: lerpC(principale, [255, 255, 255], 0.72),
    encre: [43, 31, 61],
    gris: [122, 111, 143],
    blanc: [255, 255, 255]
  };
}
/* Dégradé horizontal (jsPDF ne le gère pas nativement : fines tranches). */
function degradePdf(doc, x, y, w, h, c1, c2, c3){
  const n = Math.max(24, Math.round(w / 1.6));
  const dw = w / n;
  for (let i = 0; i < n; i++){
    const t = n === 1 ? 0 : i / (n - 1);
    const cc = t < 0.5 ? lerpC(c1, c2, t * 2) : lerpC(c2, c3, (t - 0.5) * 2);
    doc.setFillColor(cc[0], cc[1], cc[2]);
    doc.rect(x + dw * i, y, dw + 0.12, h, 'F');
  }
}

/* ---------- Typographies du site (Sora / Manrope) ----------
   Chargées une seule fois puis mises en cache. En cas d'échec réseau,
   repli silencieux sur Helvetica : la génération n'échoue jamais.     */
const POLICES_PDF = [
  ['Sora',    'normal', 'https://fonts.gstatic.com/s/sora/v17/xMQOuFFYT72X5wkB_18qmnndmSdSnn-K.ttf'],
  ['Sora',    'bold',   'https://fonts.gstatic.com/s/sora/v17/xMQOuFFYT72X5wkB_18qmnndmSe1mX-K.ttf'],
  ['Manrope', 'normal', 'https://fonts.gstatic.com/s/manrope/v20/xn7_YHE41ni1AdIRqAuZuw1Bx9mbZk79FO_F.ttf'],
  ['Manrope', 'bold',   'https://fonts.gstatic.com/s/manrope/v20/xn7_YHE41ni1AdIRqAuZuw1Bx9mbZk4aE-_F.ttf']
];
let policesPdfPromesse = null;
function chargerPolicesPdf(){
  if (!policesPdfPromesse){
    policesPdfPromesse = Promise.all(POLICES_PDF.map(async ([fam, style, url]) => {
      const r = await fetch(url);
      if (!r.ok) throw new Error('police indisponible');
      const buf = new Uint8Array(await r.arrayBuffer());
      let bin = '';
      for (let i = 0; i < buf.length; i += 0x8000)
        bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      return [fam, style, btoa(bin)];
    })).catch(e => { policesPdfPromesse = null; throw e; });
  }
  return policesPdfPromesse;
}
async function installerPolicesPdf(doc){
  try {
    (await chargerPolicesPdf()).forEach(([fam, style, b64]) => {
      const fichier = fam + '-' + style + '.ttf';
      doc.addFileToVFS(fichier, b64);
      doc.addFont(fichier, fam, style);
    });
    return { titre: 'Sora', texte: 'Manrope' };
  } catch (_){
    return { titre: 'helvetica', texte: 'helvetica' };
  }
}

/* Conditions générales, sans les mentions sur le sort de l'acompte. */
function cgvPourPdf(){
  const t = String(FACT.textes.cgv || '');
  return (t.match(/[^.]*\.?/g) || [])
    .filter(p => p.trim() && !/acquis|rembours/i.test(p))
    .join('').trim();
}

async function buildPdf(c, kind, numero){
  const jsPDF = await ensureJsPDF();
  const def = DOC_DEFS[kind];
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const PO = await installerPolicesPdf(doc);      // Sora / Manrope (typos du site)
  const W = 210, M = 14;
  const E = FACT.entreprise, B = FACT.banque, D = FACT.design || {};
  const T = pdfTheme();                           // couleurs du site (ou personnalisées)

  const fT = s => doc.setFont(PO.titre, s || 'normal');
  const fX = s => doc.setFont(PO.texte, s || 'normal');
  const col  = k => doc.setTextColor(k[0], k[1], k[2]);
  const fill = k => doc.setFillColor(k[0], k[1], k[2]);
  const draw = k => doc.setDrawColor(k[0], k[1], k[2]);
  const carte = (x, y2, w, h, r) => {
    fill(T.carte); draw(T.bord); doc.setLineWidth(0.25);
    doc.roundedRect(x, y2, w, h, r ?? 3, r ?? 3, 'FD');
  };
  const etiquette = (lab, x, y2) => {
    fill(T.principale); doc.circle(x + 5.4, y2 + 5.9, 1.05, 'F');
    fT('bold'); doc.setFontSize(7.6); col(T.principale);
    doc.text(lab, x + 8.6, y2 + 7);
  };

  /* ===== En-tête : bandeau sombre + dégradé du site ===== */
  fill(T.sombre); doc.rect(0, 0, W, 40, 'F');
  degradePdf(doc, 0, 39, W, 1.5, T.g1, T.g2, T.g3);

  let xTxt = M;
  const logo = (D.logo && D.logo.data) ? D.logo : null;
  if (logo){
    try {
      const lh = 17, ratio = (logo.w && logo.h) ? logo.w / logo.h : 1;
      const lw = Math.min(46, lh * ratio);
      doc.addImage(logo.data, 'PNG', M, 8.5, lw, lh);
      xTxt = M + lw + 6;
    } catch (_){ /* logo illisible : on continue sans */ }
  }
  col(T.blanc); fT('bold'); doc.setFontSize(18.5);
  doc.text(E.nom || 'Le Petit Booth', xTxt, 17);
  col(lerpC(T.principale, T.blanc, 0.5)); fX(); doc.setFontSize(8.8);
  doc.text(String(D.slogan || 'Entrez dans une autre dimension'), xTxt, 23.5);

  fT('bold'); doc.setFontSize(14.5); col(T.blanc);
  doc.text(def.titre, W - M, 15.5, { align:'right' });
  const wTitre = doc.getTextWidth(def.titre);
  degradePdf(doc, W - M - wTitre, 17.8, wTitre, 0.9, T.g1, T.g2, T.g3);
  fX(); doc.setFontSize(8.8); col(lerpC(T.principale, T.blanc, 0.6));
  doc.text('N° ' + numero, W - M, 24.5, { align:'right' });
  doc.text(dateFR(new Date()), W - M, 29.5, { align:'right' });

  /* ===== Cartes Émetteur / Client ===== */
  let y = 46;
  const emetteur = [E.nom, E.adresse, [E.codePostal, E.ville].filter(Boolean).join(' '), E.pays,
                    E.telephone, E.email, E.siren ? 'SIREN ' + E.siren : '', E.tva ? 'TVA ' + E.tva : '']
                   .filter(Boolean);
  const client = [[c.prenom, c.nom].filter(Boolean).join(' ') || 'Client', c.adresse,
                  [c.codePostal, c.ville].filter(Boolean).join(' '), c.pays || 'France',
                  c.telephone, c.email].filter(Boolean);
  const wC = (W - 2*M - 6) / 2;
  const hC = Math.max(emetteur.length, client.length) * 4.6 + 14.5;
  carte(M, y, wC, hC); carte(M + wC + 6, y, wC, hC);
  etiquette('ÉMETTEUR', M, y); etiquette('CLIENT', M + wC + 6, y);
  const bloc = (lignes2, x) => {
    let yy2 = y + 13.6;
    lignes2.forEach((l, i) => {
      if (i === 0){ fX('bold'); doc.setFontSize(9.2); } else { fX(); doc.setFontSize(8.7); }
      col(T.encre);
      doc.text(String(l), x + 5.4, yy2); yy2 += 4.6;
    });
  };
  bloc(emetteur, M); bloc(client, M + wC + 6);
  y += hC + 5;

  /* ===== Événement · Date · Horaires · Lieu ===== */
  const infos = [
    ['ÉVÉNEMENT', String(c.typeEvenement || '—')],
    ['DATE', c.datePrestation ? dateFR(c.datePrestation) : '—'],
    ['HORAIRES', (c.heureDebut || '—') + (c.heureFin ? ' – ' + c.heureFin : '')],
    ['LIEU', String(c.lieu || c.ville || '—')]
  ];
  const wI = (W - 2*M - 3*4) / 4;
  infos.forEach((it, i) => {
    const x = M + i * (wI + 4);
    carte(x, y, wI, 14.5, 2.6);
    fT('bold'); doc.setFontSize(6.4); col(T.gris);
    doc.text(it[0], x + 4, y + 5.4);
    fX('bold'); doc.setFontSize(8.6); col(T.encre);
    doc.text(doc.splitTextToSize(it[1], wI - 8)[0] || '—', x + 4, y + 10.8);
  });
  y += 19.5;

  /* ===== Carte Prestation (désignations + montants) ===== */
  const lignes = [];
  lignes.push({ d: formuleLabel(c) + (FORMULES[c.formule]?.desc ? ' — ' + FORMULES[c.formule].desc : ''), p: Number(c.montant||0) });
  (c.options || []).forEach(o => lignes.push({ d: 'Option — ' + (o.nom || 'option'), p: Number(o.prix||0) }));
  if (fraisKmOf(c) > 0) lignes.push({ d: 'Frais de déplacement' + (c.fraisKmLabel ? ' — ' + c.fraisKmLabel : ''), p: fraisKmOf(c) });

  const wLig = W - 2*M - 8;
  const lignesTxt = lignes.map(l => doc.splitTextToSize(String(l.d), wLig - 34).slice(0, 2));
  const obs = String(c.observations || '').trim();
  const obsTxt = obs ? doc.splitTextToSize(obs, wLig - 8) : [];
  const hRows = lignesTxt.reduce((s, ls) => s + 3.2 + ls.length * 4.4, 0);
  const hPresta = 11 + 7.8 + hRows + (obsTxt.length ? 8.5 + obsTxt.length * 4.1 : 0) + 3.5;
  carte(M, y, W - 2*M, hPresta);
  etiquette('PRESTATION', M, y);
  let yy = y + 10.6;
  fill(T.sombre); doc.roundedRect(M + 4, yy, wLig, 7.2, 1.8, 1.8, 'F');
  fT('bold'); doc.setFontSize(7.4); col(T.blanc);
  doc.text('DÉSIGNATION', M + 8, yy + 4.9);
  doc.text('MONTANT', M + 4 + wLig - 4, yy + 4.9, { align:'right' });
  yy += 7.8;
  lignesTxt.forEach((ls, i) => {
    const hR = 3.2 + ls.length * 4.4;
    if (i % 2){ fill(T.blanc); doc.roundedRect(M + 4, yy + 0.4, wLig, hR - 0.8, 1.2, 1.2, 'F'); }
    fX(); doc.setFontSize(8.9); col(T.encre);
    ls.forEach((l2, j) => doc.text(l2, M + 8, yy + 4.9 + j * 4.4));
    fX('bold');
    doc.text(fmtEur(lignes[i].p), M + 4 + wLig - 4, yy + 4.9, { align:'right' });
    yy += hR;
  });
  if (obsTxt.length){
    yy += 2;
    degradePdf(doc, M + 8, yy, wLig - 8, 0.4, T.g1, T.g2, T.g3);
    yy += 4.3;
    fT('bold'); doc.setFontSize(6.6); col(T.gris); doc.text('OBSERVATIONS', M + 8, yy);
    yy += 3.9;
    fX(); doc.setFontSize(8.2); col(T.encre);
    obsTxt.forEach(l2 => { doc.text(l2, M + 8, yy); yy += 4.1; });
  }
  y += hPresta + 5;

  /* ===== Coordonnées bancaires (à gauche) + carte des totaux (à droite) ===== */
  const xTot = 114, wTot = W - M - xTot;
  const lignesTot = [['Sous-total', fmtEur(sousTotal(c)), null]];
  if (remiseOf(c) > 0)
    lignesTot.push(['Remise' + (c.remiseLabel ? ' (' + c.remiseLabel + ')' : ''), '– ' + fmtEur(remiseOf(c)), T.secondaire]);
  lignesTot.push(['TVA', fmtEur(0), null]);
  const hTot = lignesTot.length * 5.4 + 15.5;
  const lB = [B.titulaire && ('Titulaire : ' + B.titulaire), B.iban && ('IBAN : ' + B.iban), B.bic && ('BIC : ' + B.bic)].filter(Boolean);
  if (lB.length){
    const wB = xTot - M - 5;
    carte(M, y, wB, Math.max(hTot, 12.5 + lB.length * 4.6));
    etiquette('COORDONNÉES BANCAIRES', M, y);
    fX(); doc.setFontSize(8.3); col(T.encre);
    let yB = y + 13.4;
    lB.forEach(l2 => { doc.text(doc.splitTextToSize(String(l2), wB - 11)[0], M + 5.4, yB); yB += 4.6; });
  }
  carte(xTot, y, wTot, hTot);
  let yT = y + 6.8;
  lignesTot.forEach(l2 => {
    fX(); doc.setFontSize(8.6); col(l2[2] || T.gris);
    doc.text(l2[0], xTot + 5, yT);
    fX('bold'); col(l2[2] || T.encre);
    doc.text(l2[1], xTot + wTot - 5, yT, { align:'right' });
    yT += 5.4;
  });
  degradePdf(doc, xTot + 5, yT - 2.4, wTot - 10, 0.45, T.g1, T.g2, T.g3);
  yT += 2.4;
  fT('bold'); doc.setFontSize(10.5); col(T.encre);
  doc.text('TOTAL TTC', xTot + 5, yT);
  doc.text(fmtEur(totalTTC(c)), xTot + wTot - 5, yT, { align:'right' });
  y += Math.max(hTot, lB.length ? 12.5 + lB.length * 4.6 : 0) + 5;

  // Montant dû selon le type de document (logique inchangée)
  let montantDu = totalTTC(c), mention = '';
  if (kind === 'factureAcompte'){
    montantDu = montantAcompte(c);
    mention = "Acompte de " + pctAcompte(c) + " % sur un total de " + fmtEur(totalTTC(c)) + ".";
  } else if (kind === 'factureSolde'){
    montantDu = montantSolde(c);
    mention = "Solde après acompte de " + fmtEur(montantAcompte(c)) + " (total " + fmtEur(totalTTC(c)) + ").";
  } else if (kind === 'devis'){
    mention = "Acompte de " + pctAcompte(c) + " % (" + fmtEur(montantAcompte(c)) + ") à la réservation, solde de "
            + fmtEur(montantSolde(c)) + " selon les conditions ci-dessous.";
  }

  /* ===== Le montant : l'élément le plus visible du document ===== */
  fill(T.sombre); doc.roundedRect(M, y, W - 2*M, 17, 3, 3, 'F');
  degradePdf(doc, M + 3, y + 1.1, W - 2*M - 6, 0.7, T.g1, T.g2, T.g3);
  fT('bold'); doc.setFontSize(10.5); col(T.blanc);
  doc.text(kind === 'devis' ? 'TOTAL À RÉGLER' : 'NET À PAYER', M + 7, y + 11);
  doc.setFontSize(19.5);
  doc.text(fmtEur(montantDu), W - M - 7, y + 11.9, { align:'right' });
  y += 22;

  if (mention){
    fX(); doc.setFontSize(8.3); col(T.gris);
    doc.splitTextToSize(mention, W - 2*M).forEach(l2 => { doc.text(l2, M, y); y += 4.3; });
    y += 1;
  }

  /* ===== Échéances / validité ===== */
  fX(); doc.setFontSize(8.3); col(T.encre);
  if (kind === 'devis'){
    doc.text("Devis valable " + FACT.delaiValidite + " jours, jusqu'au "
      + dateFR(addDays(new Date(), Number(FACT.delaiValidite||30))) + '.', M, y); y += 5.2;
  } else {
    doc.text('Règlement sous ' + FACT.delaiPaiement + ' jours, au plus tard le '
      + dateFR(addDays(new Date(), Number(FACT.delaiPaiement||30))) + '.', M, y); y += 5.2;
  }

  /* ===== Texte d'accompagnement ===== */
  const intro = kind === 'devis' ? FACT.textes.devis : FACT.textes.facture;
  if (intro && y < 252){
    col(T.gris); doc.setFontSize(8.3);
    doc.splitTextToSize(intro, W - 2*M).forEach(l2 => { doc.text(l2, M, y); y += 4.3; });
    y += 1.5;
  }

  /* ===== Conditions + mentions légales ===== */
  const bas = 272;
  if (y < bas - 26) y = bas - 26;
  fX(); doc.setFontSize(6.6); col(T.gris);
  const cgv = cgvPourPdf();
  if (cgv && y < 266)
    doc.splitTextToSize(cgv, W - 2*M).slice(0, 5).forEach(l2 => { doc.text(l2, M, y); y += 3.1; });
  if (FACT.textes.mentions && y < 279){ y += 1.5; fX('bold'); doc.text(FACT.textes.mentions, M, y); }

  /* ===== Pied de page ===== */
  degradePdf(doc, M, 282.5, W - 2*M, 0.8, T.g1, T.g2, T.g3);
  const contacts = [E.nom, E.siteWeb, E.telephone, E.email].filter(Boolean).join('  ·  ');
  const pied = String(D.piedDePage || '').trim();
  fX(); doc.setFontSize(7); col(T.gris);
  if (pied){
    doc.text(pied, W/2, 287.3, { align:'center' });
    doc.setFontSize(6.3);
    doc.text(contacts, W/2, 291.3, { align:'center' });
  } else {
    doc.text(contacts, W/2, 288, { align:'center' });
  }

  return doc;
}

/* ---------- Génération + archivage ---------- */
async function genererDocuments(){
  const c = findClient(state.modalClientId);
  if (!c){ toast("Enregistrez d'abord la fiche."); return; }
  if (!c.prenom && !c.nom){ toast('Renseignez le nom du client.'); return; }
  if (totalTTC(c) <= 0){ toast('Renseignez un montant avant de générer.'); return; }
  const btn = $('#gen-docs'); if (btn){ btn.disabled = true; btn.textContent = 'Génération…'; }
  try {
    for (const kind of ['devis','factureAcompte','factureSolde','factureGlobale']){
      await genererUnDocument(c, kind, false);
    }
    await dbSaveClient(c);
    renderModal();
    toast('4 documents générés ✓');
  } catch (e){
    console.error(e); toast('Erreur : ' + (e.message || 'génération impossible'));
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = 'Générer les documents'; }
  }
}

async function genererUnDocument(c, kind, save = true){
  const def = DOC_DEFS[kind];
  c.documents = c.documents || {};
  const existant = c.documents[kind];
  // On conserve le numéro d'origine lors d'une régénération
  const numero = (existant && existant.numero) ? existant.numero : await nextDocNumber(def.prefix);
  const doc = await buildPdf(c, kind, numero);
  const dataUrl = doc.output('datauristring');
  const nom = numero.replace('/', '-') + ' — ' + def.titre.toLowerCase() + ' — '
            + [c.prenom, c.nom].filter(Boolean).join(' ') + '.pdf';
  c.documents[kind] = {
    name: nom, size: Math.round(dataUrl.length * 0.75), data: dataUrl,
    numero, genere_le: new Date().toISOString(),
    montant: kind === 'factureAcompte' ? montantAcompte(c)
           : kind === 'factureSolde' ? montantSolde(c) : totalTTC(c)
  };
  if (save){ await dbSaveClient(c); renderModal(); toast(def.titre + ' régénéré ✓'); }
  return c.documents[kind];
}

async function regenererDocument(kind){
  const c = findClient(state.modalClientId); if (!c) return;
  try { await genererUnDocument(c, kind, true); }
  catch (e){ console.error(e); toast('Erreur : ' + (e.message || 'échec')); }
}

function ouvrirDocument(kind){
  const c = findClient(state.modalClientId);
  const d = c?.documents?.[kind]; if (!d) return;
  const w = window.open(); if (!w){ toast('Autorisez les fenêtres pop-up'); return; }
  w.document.write('<iframe src="' + d.data + '" style="border:0;width:100%;height:100%;position:absolute;inset:0"></iframe>');
  w.document.title = d.name;
}

/* ---------- Statuts ---------- */
async function setDocStatut(champ, valeur){
  const c = findClient(state.modalClientId); if (!c) return;
  c.factu = Object.assign(factuOf(c), { [champ]: valeur });
  try { await dbSaveClient(c); renderModal(); } catch (e){ console.error(e); }
}

/* ---------- Enregistrement manuel d'un règlement (admin) ---------- */
async function enregistrerReglement(){
  const c = findClient(state.modalClientId); if (!c) return;
  const type = $('#pay-type')?.value || 'acompte';
  const moyen = $('#pay-moyen')?.value || 'virement';
  const montants = { acompte: montantAcompte(c), solde: montantSolde(c), total: totalTTC(c) };
  const montant = montants[type] || 0;
  const lib = { acompte:"l'acompte", solde:'le solde', total:'la totalité' }[type];
  if (!confirm('Enregistrer ' + lib + ' de ' + fmtEur(montant) + ' comme reçu (' + moyen + ') ?')) return;
  await enregistrerPaiement(c, type, montant, moyen);
}

async function enregistrerPaiement(c, type, montant, moyen){
  const p = { type, montant, statut:'paye', moyen, date:new Date().toISOString() };
  c.paiements = paiementsOf(c).concat([p]);
  const f = factuOf(c);
  if (type === 'acompte'){
    f.faStatut = 'payee'; f.fsStatut = 'a_payer'; f.devisStatut = 'accepte'; f.paiementStatut = 'acompte';
    if (['demande','devis','attente'].includes(c.status)) c.status = 'acompte';
  } else if (type === 'solde'){
    f.fsStatut = 'payee'; f.paiementStatut = 'complet'; f.fStatut = 'payee';
    c.status = 'solde';
  } else if (type === 'total'){
    f.faStatut = 'payee'; f.fsStatut = 'payee'; f.fStatut = 'payee';
    f.devisStatut = 'accepte'; f.paiementStatut = 'complet';
    c.status = 'solde';
  }
  c.factu = f;
  try {
    await dbSaveClient(c);
    if (supa && c.id){
      await supa.rpc('paiement_enregistrer', {
        p_client_id: c.id, p_type: type, p_montant: montant,
        p_statut: 'paye', p_moyen: moyen, p_reference: null,
        p_stripe_session: null, p_stripe_payment: null
      });
    }
  } catch (e){ console.error(e); }
  renderModal();
  toast('Paiement enregistré ✓');
}

  </div>

  <div class="block-title">Enregistrer un règlement reçu</div>
  <p style="color:var(--muted);font-size:12.5px;line-height:1.6;margin:0 0 12px">

    Utilisez ce bloc uniquement pour les règlements reçus <b>hors ligne</b> :

function factPersoToggle(actif){

function chargerLogoDoc(input){
  const fichier = input.files && input.files[0];
  if (!fichier) return;
  const img = new Image();
  const url = URL.createObjectURL(fichier);
  img.onload = () => {
    const max = 420, r = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.width * r));
    cv.height = Math.max(1, Math.round(img.height * r));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    FACT.design = FACT.design || {};
    FACT.design.logo = { data: cv.toDataURL('image/png'), w: cv.width, h: cv.height };
    URL.revokeObjectURL(url);
    const ap = $('#fx-d-logo-apercu');
    if (ap){ ap.src = FACT.design.logo.data; ap.style.display = ''; }
    toast('Logo chargé — pensez à enregistrer les paramètres');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Image illisible'); };
  img.src = url;
}
function retirerLogoDoc(){
  if (FACT.design) FACT.design.logo = '';

  toast('Logo retiré — pensez à enregistrer les paramètres');

async function payerClient(type){
  const c = state.publicData && state.publicData.client;
  if (!c) return;
  const err = document.getElementById('pay-err');
  const boutons = document.querySelectorAll('.fbtns .btn');
  const remettre = () => boutons.forEach(b => { b.disabled = false; b.style.opacity = ''; });
  boutons.forEach(b => { b.disabled = true; b.style.opacity = '.6'; });
  if (err) err.textContent = 'Redirection vers le paiement sécurisé…';

  try {
    // Le montant est recalculé et vérifié côté serveur : on n'envoie que
    // le lien privé et le type de règlement.
    const r = await fetch('/api/stripe-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: c.token, type, retour: baseUrl() })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.url) throw new Error(data.error || "Le paiement n'a pas pu être ouvert.");
    // On réactive les boutons juste avant de partir vers Stripe : ainsi, si
    // le client revient avec « précédent », la page restaurée est utilisable.
    remettre();
    if (err) err.textContent = '';
    window.location.href = data.url;
  } catch (e) {
    remettre();
    if (err) err.textContent = e.message || "Le paiement est momentanément indisponible. Réessayez ou contactez-nous.";
  }
}

/* ---------- Retour de Stripe : confirmation + rafraîchissement ----------
   L'adresse de retour contient l'identifiant de la session Stripe.
   On demande au serveur (/api/stripe-verify) de relire cette session chez
   Stripe et d'enregistrer le paiement en base — c'est idempotent, donc
   sans conflit avec le webhook. Puis on relit la fiche jusqu'à ce que le
   paiement apparaisse : statuts, montants et boutons se mettent à jour. */
async function confirmerRetourStripe(token){
  const q = (location.hash.split('?')[1] || '');
  const session = (q.match(/session=([^&]+)/) || [])[1] || null;
  if (session){
    try {
      await fetch('/api/stripe-verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: decodeURIComponent(session), token })
      });
    } catch (_){ /* pas grave : le webhook prendra le relais */ }
  }
  // Plusieurs relectures : l'enregistrement peut mettre quelques secondes.
  for (const delai of [300, 2500, 6000, 12000]){
    await new Promise(r => setTimeout(r, delai));
    const f = await fetchClientPublic(token);
    if (f){
      showPublic(renderClientPublic(f));
      const fx = f.factu || {};
      if (fx.paiementStatut && fx.paiementStatut !== 'aucun') break;
    }
  }
}

async function pubDownload(token,key){
  let c=clientByToken(token);
  if(!c) c=await fetchClientPublic(token);
  const d=c&&c.documents&&c.documents[key]; if(!d)return;
  const a=document.createElement('a');a.href=d.data;a.download=d.name;a.click();
}

/* =========================================================
   ROUTEUR (liens privés vs administration)
========================================================= */
function showPublic(html){
  $('#login').style.display='none'; $('#app').style.display='none';
  const p=$('#public'); p.style.display='block'; p.innerHTML=html;
  window.scrollTo(0,0);
}
function invalidLink(){
  showPublic(`${svgDefs}<div class="content" style="max-width:520px;margin:0 auto;text-align:center;padding-top:70px">
    ${PUB_HEADER}<div class="card" style="padding:34px"><h2 style="font-family:'Sora'">Lien invalide</h2>
    <p style="color:var(--muted);margin-top:8px">Ce lien privé n'existe pas ou a été révoqué. Contactez Le Petit Booth.</p></div>${adminBack}</div>`);
}
async function route(){
  // Le jeton s'arrête au premier « ? » : au retour de Stripe, l'adresse
  // contient « ?paiement=ok » qu'il ne faut pas confondre avec le jeton.
  const m=(location.hash||'').match(/^#\/(client|prestataire)\/([^?]+)/);
  if(m){
    if(m[1]==='client'){
      await factLoad();
      const c=await fetchClientPublic(m[2]);
      if(!c) return invalidLink();
      showPublic(renderClientPublic(c));
      // Retour de Stripe : on vérifie la session côté serveur puis on
      // relit la fiche jusqu'à ce que le paiement soit enregistré.
      if(/paiement=ok/.test(location.hash)){
        confirmerRetourStripe(m[2]);
      }
      return;
    }
    const d=await fetchPrestPublic(m[2]); return (d&&d.prestataire)?showPublic(renderPrestatairePublic(d.prestataire, d.missions||[])):invalidLink();
  }
  // pas de token → administration
  $('#public').style.display='none'; $('#public').innerHTML='';
  if(state.user){ enterApp(); return; }
  // Connexion automatique : on réutilise la session ouverte dans l'administration
  const auto = await autoLoginFromSession();
  if(!auto){
    // On laisse un court instant à l'administration pour transmettre la session
    // (via postMessage) avant d'afficher le formulaire de connexion.
    $('#app').style.display='none'; $('#login').style.display='none';
    let cc=document.getElementById('crm-connecting');
    if(!cc){
      cc=document.createElement('div'); cc.id='crm-connecting';
      cc.style.cssText='min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:Sora,sans-serif;font-size:14px;letter-spacing:.04em';
      cc.textContent='Connexion à l\'administration…';
      document.body.appendChild(cc);
    }
    cc.style.display='flex';
    // Intégré dans l'administration (iframe) : on ne montre JAMAIS l'écran de
    // connexion — on redemande la session à l'administration jusqu'à l'obtenir.
    // Ouvert seul (onglet direct) : comportement inchangé, connexion au bout de 2,5 s.
    let embarque=false; try{ embarque = window.parent && window.parent !== window; }catch(_){ embarque=true; }
    if(embarque){
      let essais=0;
      const relance=setInterval(()=>{
        if(state.user || ++essais>40){ clearInterval(relance); return; }
        try{ window.parent.postMessage({ type:'lpb-crm-ready' }, location.origin); }catch(_){}
      }, 700);
      setTimeout(()=>{ if(!state.user){ cc.style.display='none'; $('#login').style.display='flex'; refreshDbBadge(); } }, 30000);
    } else {
      setTimeout(()=>{ if(!state.user){ cc.style.display='none'; $('#login').style.display='flex'; refreshDbBadge(); } }, 2500);
    }
  }
}

async function autoLoginFromSession(){
  if(!supa) return false;
  try{
    const { data:{ session } } = await supa.auth.getSession();
    if(!session) return false;
    const { data, error } = await supa.rpc('admin_data',{p_pw:'__session__'});
    if(error) return false;
    state.adminPw='__session__';
    state.clients=(data&&data.clients)||[];
    state.prestataires=(data&&data.prestataires)||[];
    state.clients.forEach(c=>{ if(!Array.isArray(c.options))c.options=[]; if(!c.documents)c.documents={}; });
    state.user={role:'admin',name:'Administration'};
    enterApp();
    return true;
  }catch(e){ return false; }
}
function openPublic(kind,token){ location.hash='#/'+kind+'/'+token; }
function backToAdmin(){ if(location.hash){ history.pushState('', document.title, location.pathname+location.search); } route(); }

/* ---------- indicateur discret d'état de la base ---------- */
function refreshDbBadge(){
  const el=$('#db-badge');
  if(el){
    el.innerHTML = supaStatus==='ready'
      ? `<span style="color:var(--c-confirme)">●</span> Base connectée`
      : `<span style="color:#ff8585">⚠️ ${supaProblemMsg()}</span>`;
  }
  const el2=$('#db-badge-app');
  if(el2) el2.innerHTML = supaStatus==='ready' ? `<span style="color:var(--c-confirme)">●</span> Synchronisé (Supabase)` : '';
}

/* =========================================================
   INIT
========================================================= */
async function init(){
  initSupa();
  await route();
  refreshDbBadge();
}
window.addEventListener('hashchange', route);

/* Retour depuis Stripe avec le bouton « précédent » du navigateur : la page
   est restaurée telle quelle depuis le cache, avec les boutons de paiement
   encore désactivés (ils avaient été grisés au moment de la redirection).
   On relit alors la fiche et on réaffiche : les boutons redeviennent actifs,
   sauf si le paiement a réellement été effectué. */
window.addEventListener('pageshow', (e) => {
  if (e.persisted && /^#\/(client|prestataire)\//.test(location.hash || '')) route();
});

/* Réception de la session admin (transmise par la page d'administration
   qui contient le CRM). Aucune supposition sur le stockage : l'admin nous
   envoie directement les jetons, on ouvre la session, on entre. */
window.addEventListener('message', async (e)=>{
  if(e.origin !== location.origin) return;
  const d = e.data || {};
  if(d.type === 'lpb-session' && d.access_token && supa){
    try{
      await supa.auth.setSession({ access_token: d.access_token, refresh_token: d.refresh_token });
    }catch(_){}
    if(!state.user){ await autoLoginFromSession(); }
  }
});
// Signale à l'admin qu'on est prêt à recevoir la session.
try{ if(window.parent && window.parent !== window) window.parent.postMessage({ type:'lpb-crm-ready' }, location.origin); }catch(_){}

init();

  openPrest,closePrest,savePrest,deletePrest,
  pipeSearch,listSearch,

  copyLink,openPublic,backToAdmin,pubDownload,saveMusiques};
})();
